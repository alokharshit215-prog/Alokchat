name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable could not be detected."
            exit 1
          fi
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version
          VERSION_LINE="$(java -version 2>&1 | head -n 1)"
          RAW_VERSION="$(printf '%s\n' "$VERSION_LINE" | sed -n 's/.*version "\([^"]*\)".*/\1/p')"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Failed to detect active Java version from: $VERSION_LINE"
            exit 1
          fi
          MAJOR_VERSION="$(printf '%s\n' "$RAW_VERSION" | cut -d. -f1)"
          if [ "$MAJOR_VERSION" = "1" ]; then
            MAJOR_VERSION="$(printf '%s\n' "$RAW_VERSION" | cut -d. -f2)"
          fi
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse numeric Java major version from: $RAW_VERSION"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected version $MAJOR_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL_BIN="keytool"
          if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          fi
          if [ ! -f "./debug.keystore" ]; then
            if ! "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000; then
              echo "::error::Failed to generate temporary ./debug.keystore."
              exit 1
            fi
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Temporary ./debug.keystore is missing or empty."
            exit 1
          fi
          echo "Temporary ./debug.keystore verified."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK paths discovered under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty."
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::$APK_PATH does not have the .apk extension."
            exit 1
          fi
          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Source APK missing or empty at $SOURCE_APK"
            exit 1
          fi
          TEMP_RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP}/release-apk-XXXXXX")"
          TARGET_APK="${TEMP_RELEASE_DIR}/app-debug.apk"
          cp "$SOURCE_APK" "$TARGET_APK"
          if [ ! -f "$TARGET_APK" ] || [ ! -s "$TARGET_APK" ]; then
            echo "::error::Failed to prepare release asset at $TARGET_APK"
            exit 1
          fi
          echo "asset_path=${TARGET_APK}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at ${TARGET_APK}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Prepared APK does not exist or is empty."
            exit 1
          fi
          if [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Prepared asset does not end in .apk."
            exit 1
          fi
          ASSET_FILENAME="$(basename "${ASSET_PATH}")"
          if [ "${ASSET_FILENAME}" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be exactly app-debug.apk, got ${ASSET_FILENAME}."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="$(printf '%s\n' \
            "This is an automatically generated debug APK." \
            "- Built by: GitHub Actions" \
            "- GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}" \
            "- GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source Commit SHA: ${GITHUB_SHA}" \
            "- Purpose: Intended for testing only (not a Play Store production release)." \
            "- Signing: Signed only with a temporary debug keystore.")"

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
          APK_VERIFY_OUTCOME: ${{ steps.verify_apk.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"
            RELEASE_PAGE_URL="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url)"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_PAGE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_APK_URL}"
            echo "The normal GitHub Actions artifact 'app-debug-apk' remains available as a backup."

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "${DIRECT_APK_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_PAGE_URL}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- The normal GitHub Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed."
            if [ "${APK_VERIFY_OUTCOME}" = "success" ]; then
              echo "The debug APK build succeeded (app/build/outputs/apk/debug/app-debug.apk)."
            else
              echo "The debug APK build did not succeed."
            fi
            if [ "${ARTIFACT_OUTCOME}" = "success" ]; then
              echo "The GitHub Actions artifact named 'app-debug-apk' remains available."
            fi

            {
              echo "## GitHub Release Publishing Failed"
              echo ""
              if [ "${APK_VERIFY_OUTCOME}" = "success" ]; then
                echo "- The debug APK build **succeeded**."
              else
                echo "- The debug APK build did not complete successfully."
              fi
              if [ "${ARTIFACT_OUTCOME}" = "success" ]; then
                echo "- The GitHub Actions artifact **\`app-debug-apk\`** remains available for download."
              fi
              echo "- The new APK is **not** confirmed at the latest-release direct download URL because release publishing failed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
